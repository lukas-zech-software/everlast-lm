schema_version: '1.0'
workflow:
  id: pipeline
  name: Guided SDD Pipeline
  version: 1.1.0
  author: domattioli
  description: 'Chains specify → clarify → plan → tasks → analyze → implement → converge
    into one guided run with a single clarify gate and a post-implement convergence
    loop.

    '
requires:
  speckit_version: '>=0.11.2'
  integrations:
    any:
    - agy
    - claude
    - codex
    - copilot
    - gemini
    - opencode
inputs:
  spec:
    type: string
    required: true
    prompt: Describe what you want to build
  integration:
    type: string
    default: auto
    prompt: Integration to use (e.g. agy, claude, codex, copilot, gemini; 'auto' uses
      the project's initialized integration)
  with_constitution:
    type: boolean
    default: false
    prompt: Add constitution phase to the pipeline?
  with_checklist:
    type: boolean
    default: false
    prompt: Add checklist phase to the pipeline?
  skip_clarify:
    type: boolean
    default: false
    prompt: Skip the clarify gate?
steps:
- id: constitution
  type: if
  condition: '{{ inputs.with_constitution }}'
  then:
  - id: constitution-run
    command: speckit.constitution
    integration: '{{ inputs.integration }}'
    input:
      args: '{{ inputs.spec }}'
- id: specify
  command: speckit.specify
  integration: '{{ inputs.integration }}'
  input:
    args: '{{ inputs.spec }}'
- id: clarify
  type: if
  condition: '{{ inputs.skip_clarify == false }}'
  then:
  - id: clarify-run
    command: speckit.clarify
    integration: '{{ inputs.integration }}'
    input:
      args: '{{ inputs.spec }}'
  - id: clarify-gate
    type: gate
    message: Review clarifications before planning.
    options:
    - approve
    - reject
    on_reject: abort
- id: plan
  command: speckit.plan
  integration: '{{ inputs.integration }}'
  input:
    args: '{{ inputs.spec }}'
- id: checklist
  type: if
  condition: '{{ inputs.with_checklist }}'
  then:
  - id: checklist-run
    command: speckit.checklist
    integration: '{{ inputs.integration }}'
    input:
      args: '{{ inputs.spec }}'
- id: tasks
  command: speckit.tasks
  integration: '{{ inputs.integration }}'
  input:
    args: '{{ inputs.spec }}'
- id: analyze
  command: speckit.analyze
  integration: '{{ inputs.integration }}'
  input:
    args: '{{ inputs.spec }}'
- id: analyze-gate
  type: gate
  message: Review /speckit-analyze report (CC-01..CC-08 and coverage) before implementation.
  options:
  - approve
  - reject
  on_reject: abort
- id: implement
  command: speckit.implement
  integration: '{{ inputs.integration }}'
  input:
    args: '{{ inputs.spec }}'
- id: converge-loop
  type: do-while
  condition: 'true'
  max_iterations: 3
  steps:
  - id: converge
    command: speckit.converge
    integration: '{{ inputs.integration }}'
    input:
      args: '{{ inputs.spec }}'
  - id: implement-remaining
    command: speckit.implement
    integration: '{{ inputs.integration }}'
    input:
      args: Complete any tasks appended by convergence for {{ inputs.spec }}
- id: final-convergence
  command: speckit.converge
  integration: '{{ inputs.integration }}'
  input:
    args: Assess the integrated feature after the final implementation pass for {{
      inputs.spec }}. Follow the append-only convergence contract and report remaining
      findings. Do not implement additional work or claim that unavailable checks
      passed.
- id: review-completion
  type: gate
  message: Review the final convergence assessment and verification evidence for the
    integrated feature. Approve only when no in-scope work remains, required tasks
    are verified, analysis matches the current artifacts, and required tests/checks
    passed on the final result. Reject when new convergence tasks, unresolved findings,
    or required unavailable checks remain. A successful command exit is not evidence
    of completion.
  options:
  - approve
  - reject
  on_reject: abort
