name: CI

on:
  push:
    branches:
      - main
      - "feat/**"
      - "feature/**"
      - "spec/**"
      - "implement_**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Build, Lint, Test & Quality Gates
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm with runtime
        uses: lukas-zech-software/pnpm-setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1
        with:
          runtime: node@24
          cache: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Check spec integrity
        run: pnpm check:specs

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test:unit

      - name: Contract tests
        run: pnpm test:contract

      - name: Integration tests
        run: pnpm test:integration

      - name: Release Gate v1.0 automated evaluation suite
        run: node scripts/eval-v1.mjs
