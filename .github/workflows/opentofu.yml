name: OpenTofu Infrastructure

on:
  pull_request:
    branches: [main]
    paths:
      - "infra/**"
      - ".github/workflows/opentofu.yml"
  push:
    branches: [main]
    paths:
      - "infra/**"
      - ".github/workflows/opentofu.yml"
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment (dev, staging, prod)"
        required: true
        default: "dev"
        type: choice
        options:
          - dev
          - staging
          - prod
      action:
        description: "OpenTofu action to execute"
        required: true
        default: "plan"
        type: choice
        options:
          - validate
          - plan
          - apply

permissions:
  contents: read
  id-token: write

concurrency:
  group: opentofu-${{ github.workflow }}-${{ github.event.inputs.environment || github.ref }}
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  OPENTOFU_VERSION: "1.10.0"

jobs:
  # ---------------------------------------------------------------------------
  # 1. Offline Static Analysis (runs on every PR & push without GCP credentials)
  # ---------------------------------------------------------------------------
  validate:
    name: "Validate (${{ matrix.environment }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment: [dev, staging, prod]
    defaults:
      run:
        working-directory: infra/environments/${{ matrix.environment }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: ${{ env.OPENTOFU_VERSION }}
          tofu_wrapper: false

      - name: Check OpenTofu formatting (repo-wide)
        if: matrix.environment == 'dev'
        working-directory: infra
        run: tofu fmt -check -recursive

      - name: Initialize OpenTofu (backend disabled for static validation)
        run: tofu init -backend=false

      - name: Validate OpenTofu configuration & module graph
        run: tofu validate

      # Grill F11 / NFR-SEC-01 / D22: mocked-provider suites need no credentials.
      - name: Run offline OpenTofu tests (mocked providers)
        if: matrix.environment == 'dev'
        working-directory: infra
        run: |
          for dir in modules/compute modules/storage_secrets modules/iam_identity modules/code_execution environments/dev; do
            echo "::group::tofu test $dir"
            tofu -chdir="$dir" init -backend=false -input=false
            tofu -chdir="$dir" test
            echo "::endgroup::"
          done

  # ---------------------------------------------------------------------------
  # 2. Authenticated OpenTofu Plan (manual dispatch only; Keyless Workload Identity Federation)
  #    Grill F1/F27: no PR plans while PR code would run with deployer credentials, and no plan artifact:
  #    a saved plan carries the tfvars values and artifacts of a public repository are downloadable.
  # ---------------------------------------------------------------------------
  plan:
    name: "Plan (${{ inputs.environment }})"
    needs: [validate]
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'plan'
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    defaults:
      run:
        working-directory: infra/environments/${{ inputs.environment }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check whether GCP WIF variables are configured
        id: wif_check
        run: |
          if [ -z "${{ vars.GCP_WIF_PROVIDER }}" ] || [ -z "${{ vars.GCP_CI_SERVICE_ACCOUNT }}" ] || [ -z "${{ vars.GCP_TFSTATE_BUCKET }}" ] || [ -z "${{ vars.GCP_PROJECT_ID }}" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Skipping Remote Plan::GitHub Environment '${{ inputs.environment }}' does not yet have GCP_WIF_PROVIDER, GCP_CI_SERVICE_ACCOUNT, GCP_TFSTATE_BUCKET, and GCP_PROJECT_ID variables configured. Offline validation succeeded."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      # Grill F1: never plan with the root defaults; the real values come from the environment secret.
      - name: Write OpenTofu variables from the environment secret
        if: steps.wif_check.outputs.configured == 'true'
        env:
          OPENTOFU_TFVARS: ${{ secrets.OPENTOFU_TFVARS }}
        run: |
          if [ -z "$OPENTOFU_TFVARS" ]; then echo "::error::Environment secret OPENTOFU_TFVARS is empty; refusing to plan with defaults (F1)."; exit 1; fi
          umask 077; printf '%s\n' "$OPENTOFU_TFVARS" > opentofu.auto.tfvars

      - name: Setup OpenTofu
        if: steps.wif_check.outputs.configured == 'true'
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: ${{ env.OPENTOFU_VERSION }}
          tofu_wrapper: false

      - name: Authenticate to Google Cloud via Workload Identity Federation
        if: steps.wif_check.outputs.configured == 'true'
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_CI_SERVICE_ACCOUNT }}

      - name: Initialize OpenTofu with GCS state backend
        if: steps.wif_check.outputs.configured == 'true'
        run: |
          tofu init \
            -backend-config="bucket=${{ vars.GCP_TFSTATE_BUCKET }}" \
            -backend-config="prefix=opentofu/state/${{ inputs.environment }}"

      - name: Create OpenTofu execution plan
        if: steps.wif_check.outputs.configured == 'true'
        run: tofu plan -input=false -var="project_id=${{ vars.GCP_PROJECT_ID }}"

  # ---------------------------------------------------------------------------
  # 3. Authenticated OpenTofu Apply (Protected GitHub Environment Gate)
  #    Grill F1 / NFR-SEC-01: manual dispatch only; the `dev` environment requires a reviewer. The job plans and
  #    applies in one place, so no plan file leaves the protected job.
  # ---------------------------------------------------------------------------
  apply:
    name: "Apply (${{ inputs.environment }})"
    needs: [validate]
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'apply'
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    defaults:
      run:
        working-directory: infra/environments/${{ inputs.environment }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check whether GCP WIF variables are configured
        id: wif_check
        run: |
          if [ -z "${{ vars.GCP_WIF_PROVIDER }}" ] || [ -z "${{ vars.GCP_CI_SERVICE_ACCOUNT }}" ] || [ -z "${{ vars.GCP_TFSTATE_BUCKET }}" ] || [ -z "${{ vars.GCP_PROJECT_ID }}" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Skipping Remote Apply::GitHub Environment variables are not yet configured."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      # Grill F1: never apply root defaults; the real values come from the environment secret.
      - name: Write OpenTofu variables from the environment secret
        if: steps.wif_check.outputs.configured == 'true'
        env:
          OPENTOFU_TFVARS: ${{ secrets.OPENTOFU_TFVARS }}
        run: |
          if [ -z "$OPENTOFU_TFVARS" ]; then echo "::error::Environment secret OPENTOFU_TFVARS is empty; refusing to apply with defaults (F1)."; exit 1; fi
          umask 077; printf '%s\n' "$OPENTOFU_TFVARS" > opentofu.auto.tfvars

      - name: Setup OpenTofu
        if: steps.wif_check.outputs.configured == 'true'
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: ${{ env.OPENTOFU_VERSION }}
          tofu_wrapper: false

      - name: Authenticate to Google Cloud via Workload Identity Federation
        if: steps.wif_check.outputs.configured == 'true'
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_CI_SERVICE_ACCOUNT }}

      - name: Initialize OpenTofu with GCS state backend
        if: steps.wif_check.outputs.configured == 'true'
        run: |
          tofu init \
            -backend-config="bucket=${{ vars.GCP_TFSTATE_BUCKET }}" \
            -backend-config="prefix=opentofu/state/${{ inputs.environment }}"

      - name: Plan and apply in the protected job
        if: steps.wif_check.outputs.configured == 'true'
        run: |
          tofu plan -input=false -var="project_id=${{ vars.GCP_PROJECT_ID }}" -out=tfplan.binary
          tofu apply -input=false -auto-approve tfplan.binary
