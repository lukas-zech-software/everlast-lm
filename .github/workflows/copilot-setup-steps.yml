name: "Copilot Setup Steps"

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

permissions:
  contents: read

jobs:
  copilot-setup-steps:
    name: copilot-setup-steps
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Enable pnpm and install Specify CLI
        run: |
          corepack enable pnpm
          if command -v uv >/dev/null 2>&1; then
            uv tool install specify-cli --from git+https://github.com/github/spec-kit.git || true
          elif command -v pipx >/dev/null 2>&1; then
            pipx install --git https://github.com/github/spec-kit.git specify-cli || true
          fi

      - name: Verify Spec Integrity
        run: node scripts/check-spec-integrity.mjs
